name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      # The tests hit the shared Twikey beta account, whose feed endpoints are
      # serialised per API key. Running the matrix legs at the same time makes
      # them fail each other with err_call_in_progress.
      max-parallel: 1
      matrix:
        ruby-version: ['3.2', '3.3']

    name: Ruby (${{ matrix.ruby-version }})
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Run tests
        run: bundle install && bundle exec rake test